oc get secret alertmanager-main -n openshift-monitoring -o jsonpath='{.data.alertmanager\.yaml}' | base64 -d

global:
  resolve_timeout: 5m
receivers:
  - name: 'null'
  - name: Support - Warnings
    email_configs:
      - to: openshift.alerts@email.com
        from: phub.ocp.cluster-warnings@email.com
        smarthost: "ipaddress:587"
        require_tls: False
  - name: Support - Critical
    email_configs:
      - to: openshift.alerts@email.com
        from: phub.ocp.cluster-critical@email.com
        smarthost: "xx.xx.xx.xx:587"
        require_tls: False
route:
  group_by:
    - namespace
  group_interval: 5m
  group_wait: 30s
  receiver: 'null'
  repeat_interval: 12h
  routes:
    - match:
        alertname: Watchdog
      receiver: 'null'
    - receiver: Support - Warnings
      match:
        severity: warn
      continue: true
    - receiver: Support - Critical
      match:
        severity: critical
