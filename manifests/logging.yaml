---
apiVersion: v1
kind: Secret
metadata:
  name: logging-loki-bucket
  namespace: openshift-logging
stringData:
  access_key_id: <ACCESS_KEY>
  access_key_secret: <SECRET_KEY>
  bucketnames: phub-bucket
  endpoint: https://mybucket.com
  region: us-east-1
...
# oc -n openshift-logging create cm loki-s3-ca --from-file=service-ca.crt=sectigo-ca.crt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
name: clusterlogforwarder-editor-role
rules:
  - apiGroups:
    - observability.openshift.io
    resources:
    - clusterlogforwarders
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
...
# oc create sa collector-account -n openshift-logging

# oc adm policy add-cluster-role-to-user cluster-logging-write-application-logs system:serviceaccount:openshift-logging:collector-account

# oc adm policy add-cluster-role-to-user cluster-logging-write-audit-logs system:serviceaccount:openshift-logging:collector-account

# oc adm policy add-cluster-role-to-user cluster-logging-write-infrastructure-logs system:serviceaccount:openshift-logging:collector-account

# oc adm policy add-cluster-role-to-user clusterlogforwarder-editor-role system:serviceaccount:openshift-logging:collector-account

# oc adm policy add-cluster-role-to-user collect-application-logs system:serviceaccount:openshift-logging:collector-account

# oc adm policy add-cluster-role-to-user collect-infrastructure-logs system:serviceaccount:openshift-logging:collector-account

# oc adm policy add-cluster-role-to-user collect-audit-logs system:serviceaccount:openshift-logging:collector-account

# oc adm policy add-cluster-role-to-user logging-collector-logs-writer system:serviceaccount:openshift-logging:collector-account
---
apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: logging-loki
  namespace: openshift-logging
spec:
  managementState: Managed
  limits:
    global:
      retention:
        days: 20
  size: 1x.small
  storage:
    schemas:
    - version: v13
      effectiveDate: "<yyyy>-<mm>-<dd>"
    secret:
      name: logging-loki-s3
      type: s3
  storageClassName: <storage_class_name>
  tenants:
    mode: openshift-logging
---
