# oc get dpa -o yaml -n open-cluster-management-backup
apiVersion: oadp.openshift.io/v1alpha1
kind: DataProtectionApplication
metadata:
  name: acm-backup
  namespace: open-cluster-management-backup
spec:
  backupLocations:
  - velero:
      config:
        profile: default
        region: us-east-1
        s3ForcePathStyle: "true"
        s3Url: http://endpoint:port
      credential:
        key: cloud
        name: cloud-credentials
      default: true
      objectStorage:
        bucket: <backup-bucket>
        caCert: <if any>
        prefix: velero
      provider: aws
  configuration:
    nodeAgent:
      enable: true
      uploaderType: restic
    velero:
      defaultPlugins:
      - openshift
      - aws
      - kubevirt


