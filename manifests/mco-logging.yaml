# oc get backupschedule -o yaml -n open-cluster-management-backup
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: BackupSchedule
metadata:
  name: schedule-acm
  namespace: open-cluster-management-backup
spec:
    veleroSchedule: 0 */6 * * *
    veleroTtl: 120h
    
