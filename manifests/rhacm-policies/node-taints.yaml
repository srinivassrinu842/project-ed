---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-node-role-labels
  namespace: rhacm-policies
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: node-role-labels-infra
        spec:
          pruneObjectBehavior: None
          remediationAction: enforce
          severity: medium
          object-templates-raw: |
            {{- range (lookup "v1" "Node" "" "").items }}
            {{- if contains "in" .metadata.name }}       ## Looks for string 'inf' in hostname for infra nodes
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Node
                metadata:
                  name: {{ .metadata.name }}
                  labels:
                    node-role.kubernetes.io/infra: ""
            {{- end }}
            {{- end }}
...
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-node-taints
  namespace: rhacm-policies
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: node-taints-infra
        spec:
          pruneObjectBehavior: None
          remediationAction: enforce
          severity: medium
          object-templates-raw: |
            {{- range (lookup "v1" "Node" "" "").items }}
            {{- if contains "in[1-3]" .metadata.name }}        ## Looks for 'inf' in the hostname to select nodes
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Node
                metadata:
                  name: {{ .metadata.name }}
                spec:
                  taints:
                    - key: node-role.kubernetes.io/infra
                      value: reserved
                      effect: NoSchedule
                    - key: node-role.kubernetes.io/infra
                      value: reserved
                      effect: NoExecute
            {{- end }}
            {{- end }}
...
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-kubelet-configs
  namespace: rhacm-policies
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: kubelet-config-master
        spec:
          pruneObjectBehavior: None
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: machineconfiguration.openshift.io/v1
                kind: KubeletConfig
                metadata:
                  name: kubelet-config-master
                spec:
                  autoSizingReserved: true
                  machineConfigPoolSelector:
                    matchLabels:
                      pools.operator.machineconfiguration.openshift.io/master: ""
                  kubeletConfig:
                    maxPods: 500
                    nodeStatusMaxImages: -1
                    kubeAPIBurst: 200
                    kubeAPIQPS: 100
                    evictionSoft:
                      memory.available: "1Gi"
                      nodefs.available: "10%"
                      imagefs.available: "10%"
                    evictionSoftGracePeriod:
                      memory.available: "1m30s"
                      nodefs.available: "1m30s"
                      imagefs.available: "1m30s"
                    evictionHard:
                      memory.available: "500Mi"
                      nodefs.available: "5%"
                      imagefs.available: "5%"
                    evictionPressureTransitionPeriod: 30s
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: kubelet-config-worker
        spec:
          pruneObjectBehavior: None
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: machineconfiguration.openshift.io/v1
                kind: KubeletConfig
                metadata:
                  name: kubelet-config-worker
                spec:
                  autoSizingReserved: true
                  machineConfigPoolSelector:
                    matchLabels:
                      pools.operator.machineconfiguration.openshift.io/worker: ""
                  kubeletConfig:
                    maxPods: 500
                    nodeStatusMaxImages: -1
                    kubeAPIBurst: 200
                    kubeAPIQPS: 100
                    evictionSoft:
                      memory.available: "1Gi"
                      nodefs.available: "10%"
                      imagefs.available: "10%"
                    evictionSoftGracePeriod:
                      memory.available: "1m30s"
                      nodefs.available: "1m30s"
                      imagefs.available: "1m30s"
                    evictionHard:
                      memory.available: "500Mi"
                      nodefs.available: "5%"
                      imagefs.available: "5%"
                    evictionPressureTransitionPeriod: 30s
...
