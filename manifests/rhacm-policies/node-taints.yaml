---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-timezone
  namespace: rhacm-policies
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: timezone-config-master
        spec:
          pruneObjectBehavior: None
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: machineconfiguration.openshift.io/v1
                kind: MachineConfig
                metadata:
                  name: 99-master-timezone
                  labels:
                    machineconfiguration.openshift.io/role: master
                spec:
                  config:
                    ignition:
                      version: 3.4.0
                    systemd:
                      units:
                        - name: custom-timezone.service
                          enabled: true
                          contents: |
                            [Unit]
                            Description=Set timezone
                            After=network-online.target

                            [Service]
                            Type=oneshot
                            ExecStart=timedatectl set-timezone Asia/Dubai

                            [Install]
                            WantedBy=multi-user.target
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: timezone-config-worker
        spec:
          pruneObjectBehavior: None
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: machineconfiguration.openshift.io/v1
                kind: MachineConfig
                metadata:
                  name: 99-worker-timezone
                  labels:
                    machineconfiguration.openshift.io/role: worker
                spec:
                  config:
                    ignition:
                      version: 3.4.0
                    systemd:
                      units:
                        - name: custom-timezone.service
                          enabled: true
                          contents: |
                            [Unit]
                            Description=Set timezone
                            After=network-online.target

                            [Service]
                            Type=oneshot
                            ExecStart=timedatectl set-timezone Asia/Dubai

                            [Install]
                            WantedBy=multi-user.target
...
---
apiVersion: policy.open-cluster-management.io/v1beta1
kind: PolicySet
metadata:
  name: ps-node-config
  namespace: rh-policies
spec:
  description: Node configuration including labels, taints, MCPs, and system settings
  policies:
    - policy-node-labels
    - policy-node-taints
    - policy-kubelet-configs
    - policy-chrony
    - policy-timezone
...
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: all-clusters-placement
  namespace: rhacm-policies
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector: {}
...
---
apiVersion: policy.open-cluster-management.io/v1beta1
kind: PlacementBinding
metadata:
  name: pb-ps-node-config
  namespace: rhacm-policies
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: all-clusters-placement
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: PolicySet
    name: ps-node-config
...
