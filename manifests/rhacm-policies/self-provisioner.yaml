---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-disable-selfprovision
  namespace: rhacm-policies
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: disable-self-provisioners
        spec:
          pruneObjectBehavior: None
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  annotations:
                    rbac.authorization.kubernetes.io/autoupdate: 'false'
                  name: self-provisioners
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: self-provisioner
                subjects: []
...
---
apiVersion: policy.open-cluster-management.io/v1beta1
kind: PolicySet
metadata:
  name: ps-self-provisioner
  namespace: rhacm-policies
spec:
  description: Disable user self-provisioning
  policies:
    - policy-disable-selfprovision
...
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: all-clusters-placement
  namespace: rhacm-policies
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector: {}
...
---
apiVersion: policy.open-cluster-management.io/v1beta1
kind: PlacementBinding
metadata:
  name: pb-ps-self-provisioner
  namespace: rhacm-policies
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: placement-ocpprod
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: PolicySet
    name: ps-self-provisioner
...
