apiVersion: v1
kind: Secret
metadata:
  name: ocp-cluster1-etcd-s3-creds    # <cluster-name>-etcd-s3-creds
  namespace: rhacm-policies           # Must match the Policy namespace
type: Opaque
stringData:
  # ========================================================
  # Bucket 1: Snapshot DB (Data)
  # ========================================================
  snap_aws_access_key_id: "AKIA_SNAP_USER..."
  snap_aws_secret_access_key: "wJalr_SNAP_SECRET..."
  snap_region: "us-east-1"
  snap_s3_bucket: "mycorp-etcd-snap-cluster1"
  snap_s3_endpoint_url: "http://storage.internal.example.com:9020" # Optional: leave empty or delete if AWS

  # ========================================================
  # Bucket 2: Static Resources & Encryption Keys (Keys)
  # ========================================================
  static_aws_access_key_id: "AKIA_STATIC_KEYS_USER..."
  static_aws_secret_access_key: "wJalr_STATIC_KEYS_SECRET..."
  static_region: "us-east-1"
  static_s3_bucket: "mycorp-etcd-static-cluster1"
  static_s3_endpoint_url: "http://storage.internal.example.com:9020" # Optional: leave empty or delete if AWS
