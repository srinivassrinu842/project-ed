---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-etcd-encryption
  namespace: rhacm-policies
spec:
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: etcd-encryption
        spec:
          pruneObjectBehavior: None
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: APIServer
                metadata:
                  name: cluster
                spec:
                  encryption:
                    type: aescbc
...
---
apiVersion: policy.open-cluster-management.io/v1beta1
kind: PolicySet
metadata:
  name: ps-etcd
  namespace: rhacm-policies
spec:
  description: etcd encryption and backup configuration
  policies:
    - policy-etcd-encryption
...
